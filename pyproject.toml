[tool.poetry]
name = "Currency Converter Offline Backend"
version = "0.1.0"
description = ""
authors = ["Qaiser <link2qaiser@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "currency-converter-offline-backend"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
httpx = "^0.28.1"
boto3 = "^1.38.46"
urllib3 = "1.26.20"
pydantic-settings = "^2.10.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.41"}
asyncpg = "^0.30.0"
psycopg = {extras = ["binary"], version = "^3.2.9"}
psycopg2-binary = "2.9.9"


[tool.poetry.group.dev.dependencies]
colorlog = "^6.7.0"
pre-commit = "^3.3.3"
pytest = "^8.1.1"
pytest-xdist = "^3.3.1"
pytest-django = "^4.5.2"
model-bakery = "^1.12.0"
vcrpy = "^6.0.1"
pytest-env = "^1.1.3"
pytest-cov = "^5.0.0"

[tool.isort]
line_length = 119
multi_line_output = 5

[tool.yapf]
align_closing_bracket_with_visual_indent = true
based_on_style = "google"
coalesce_brackets = true
column_limit = 119
dedent_closing_brackets = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
